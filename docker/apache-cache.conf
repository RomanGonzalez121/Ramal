# Los archivos de /build llevan el contenido en el nombre (cambian si cambia el archivo), así que se guardan un año.
<LocationMatch "^/build/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

<LocationMatch "^/(favicon|apple-touch-icon|icon-)">
    Header set Cache-Control "public, max-age=86400"
</LocationMatch>

# Texto comprimido: HTML, CSS, JS y JSON de la API.
AddOutputFilterByType DEFLATE text/html text/css application/javascript text/javascript application/json application/yaml image/svg+xml
