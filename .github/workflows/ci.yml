name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: ramal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependencias de PHP
        run: composer install --no-interaction --prefer-dist

      - name: Dependencias sin vulnerabilidades conocidas
        run: composer audit

      - name: Dependencias de JavaScript
        run: npm ci

      - name: Estilo con Pint
        run: vendor/bin/pint --test

      - name: Tests de JavaScript (interpolador, reproductor, tiempo real, calculadora)
        run: npm run test:js

      - name: Compilar assets
        run: npm run build

      - name: Preparar la aplicación
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests de PHP
        run: php artisan test

      # El despliegue gratuito usa SQLite: se comprueba que todo ande igual con las dos bases.
      - name: Tests de PHP con SQLite
        run: DB_CONNECTION=sqlite DB_DATABASE=:memory: php artisan test

  contenedor:
    name: Imagen de Docker
    runs-on: ubuntu-latest
    needs: pruebas

    steps:
      - uses: actions/checkout@v4

      # Compila los assets, instala las dependencias de producción y arma la imagen: si algo del despliegue se rompe, se ve acá.
      - name: Construir la imagen
        run: docker build -t ramal .

      # Es el arranque real del despliegue gratuito: base SQLite vacía, migraciones, líneas, relleno de historial y simulador.
      # Se hace con las dependencias de producción (sin Faker ni PHPUnit), que es justo donde fallan las cosas que en desarrollo andan.
      - name: El contenedor arranca con SQLite y responde
        run: |
          docker run -d --name ramal -p 8080:80             -e APP_KEY="base64:$(openssl rand -base64 32)" -e APP_URL=http://localhost:8080             -e DB_CONNECTION=sqlite -e SESSION_DRIVER=database -e CACHE_STORE=database -e QUEUE_CONNECTION=database             -e BROADCAST_CONNECTION=log -e RAMAL_SIEMPRE_EN_SERVICIO=true -e RAMAL_RELLENO_MINUTOS=5 ramal
          for i in $(seq 1 60); do curl -fs http://localhost:8080/up > /dev/null && break; sleep 3; done
          curl -fs http://localhost:8080/up > /dev/null || { docker logs ramal; exit 1; }
          for i in $(seq 1 40); do
            curl -fs http://localhost:8080/api/v1/estado | grep -q '"colectivos_en_servicio":40' && break
            sleep 3
          done
          curl -fs http://localhost:8080/api/v1/estado | grep -q '"colectivos_en_servicio":40' || { docker logs ramal; exit 1; }
          curl -fs http://localhost:8080/ > /dev/null
          if docker logs ramal 2>&1 | grep -iE "production.ERROR|Fatal error|Uncaught"; then exit 1; fi
