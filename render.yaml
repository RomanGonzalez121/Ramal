# Plano de Render (https://render.com/docs/blueprint-spec): un servicio web gratuito que usa el Dockerfile.
#
# La base es SQLite adentro del contenedor: Render no ofrece MySQL gratis y su PostgreSQL gratuito se borra a los 30 días.
# El disco del plan gratuito se borra cada vez que el servicio se duerme o se vuelve a publicar, y el contenedor rehace todo al
# despertar (migraciones, líneas, cuenta de operador y los últimos minutos de historial). Ver docs/despliegue.md.
# Los valores marcados con `sync: false` se cargan a mano en el panel de Render, nunca en el repositorio.
services:
  - type: web
    name: ramal
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Ramal
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: BROADCAST_CONNECTION
        value: log
      - key: RAMAL_SIEMPRE_EN_SERVICIO
        value: "true"
      - key: RAMAL_RELLENO_MINUTOS
        value: "30"
      - key: RAMAL_MOSTRAR_CUENTA_DEMO
        value: "true"
      - key: RAMAL_OPERADOR_PASSWORD
        sync: false
